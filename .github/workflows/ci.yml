name: CI
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint:contract
      - run: npm run build
      - name: Tes API (dengan PostgreSQL)
        run: |
          createdb -h localhost -U postgres api_test
          npm test
        env:
          PGPASSWORD: postgres
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/api_test
      - name: Uji isolasi tenant (RLS)
        run: |
          createdb -h localhost -U postgres rls_test
          PGPASSWORD=postgres PGURL=postgres://postgres:postgres@localhost:5432/rls_test ./db/test_rls.sh
        env: { PGPASSWORD: postgres }
