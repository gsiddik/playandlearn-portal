openapi: 3.0.3
info:
  title: Play & Learn API
  version: 0.1.0
  description: |
    Kontrak v0 (DRAFT, Increment 0). Sumber kebenaran untuk Android, iOS, dan Portal.
    Setiap request terautentikasi membawa tenant lewat klaim token; server memverifikasinya (Tenant_ID).
servers:
  - url: http://localhost:3000/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Cek kesehatan layanan
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /auth/parents/register:
    post:
      summary: Daftar akun orang tua (memerlukan persetujuan eksplisit)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParentRegistration' }
      responses:
        '201': { description: Akun dibuat, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokens' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      summary: Login orang tua
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Login' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokens' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /auth/schools/register:
    post:
      summary: Daftar sekolah (tenant) — pendaftar menjadi school_admin dan menyatakan dasar persetujuan orang tua murid
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schoolName, email, password, parentalConsentAttested]
              properties:
                schoolName: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 10 }
                parentalConsentAttested: { type: boolean }
      responses:
        '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokens' } } } }
  /school/teachers:
    post:
      summary: school_admin menambah akun guru
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string } } } } } }
      responses: { '201': { description: Dibuat } }
  /classes:
    get: { summary: Daftar kelas (guru), responses: { '200': { description: OK } } }
    post:
      summary: Buat kelas (guru)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } } } } } }
      responses: { '201': { description: Dibuat } }
  /classes/{classId}/students:
    get: { summary: Daftar murid kelas, parameters: [ { $ref: '#/components/parameters/ClassId' } ], responses: { '200': { description: OK } } }
    post:
      summary: Tambah murid. Respons memuat kredensial kartu (loginCode + pin 3 indeks gambar 0..8) yang hanya tampil sekali.
      parameters: [ { $ref: '#/components/parameters/ClassId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChildCreate' } } } }
      responses: { '201': { description: Dibuat } }
  /students/{studentId}/reset-pin:
    post:
      summary: Terbitkan kartu baru (kode lama dicabut)
      parameters: [ { name: studentId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { '200': { description: OK } }
  /classes/{classId}/assignments:
    get: { summary: Daftar misi yang ditugaskan, parameters: [ { $ref: '#/components/parameters/ClassId' } ], responses: { '200': { description: OK } } }
    post:
      summary: Tugaskan aktivitas ke kelas
      parameters: [ { $ref: '#/components/parameters/ClassId' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [activityId], properties: { activityId: { type: string }, dueDate: { type: string, format: date } } } } } }
      responses: { '201': { description: OK } }
  /classes/{classId}/results:
    get: { summary: Ringkasan bermain per murid (deskriptif), parameters: [ { $ref: '#/components/parameters/ClassId' } ], responses: { '200': { description: OK } } }
  /classes/{classId}/gradebook:
    get:
      summary: Buku nilai DESKRIPTIF kelas (status per murid per aktivitas + aturan transparan; draf menunggu validasi ahli PAUD)
      parameters: [ { $ref: '#/components/parameters/ClassId' } ]
      responses: { '200': { description: OK } }
  /ops/packs:
    get: { summary: 'Daftar versi content pack (ops_admin, content_designer)', responses: { '200': { description: OK } } }
    post:
      summary: Simpan draf content pack (divalidasi; versi harus naik; versi terbit tidak dapat diubah)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [manifest], properties: { manifest: { type: object } } } } } }
      responses: { '201': { description: Draf disimpan }, '400': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /ops/packs/validate:
    post:
      summary: Validasi manifest tanpa menyimpan
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [manifest], properties: { manifest: { type: object } } } } } }
      responses: { '201': { description: Hasil validasi } }
  /ops/packs/{version}:
    get:
      summary: Ambil satu versi
      parameters: [ { name: version, in: path, required: true, schema: { type: integer } } ]
      responses: { '200': { description: OK } }
  /ops/packs/{version}/publish:
    post:
      summary: Terbitkan draf (ops_admin)
      parameters: [ { name: version, in: path, required: true, schema: { type: integer } } ]
      responses: { '201': { description: Terbit } }
  /ops/packs/{version}/retire:
    post:
      summary: Tarik versi terbit (ops_admin)
      parameters: [ { name: version, in: path, required: true, schema: { type: integer } } ]
      responses: { '201': { description: Ditarik } }
  /ops/schools:
    get: { summary: Statistik agregat sekolah (ops_admin; tanpa data anak), responses: { '200': { description: OK } } }
  /ops/assets:
    get: { summary: 'Daftar aset (ops_admin, content_designer); filter kind=image|audio', responses: { '200': { description: OK } } }
    post:
      summary: 'Unggah berkas atau hasil rekaman browser (base64). Tipe diverifikasi dari isi; gambar maks 2 MB, audio maks 5 MB.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, mime, dataBase64]
              properties:
                name: { type: string }
                purpose: { type: string, enum: [instruksi, umpan_balik, efek, ilustrasi, lainnya] }
                language: { type: string }
                transcript: { type: string }
                mime: { type: string }
                recorded: { type: boolean }
                dataBase64: { type: string }
      responses: { '201': { description: Dibuat }, '400': { $ref: '#/components/responses/Error' } }
  /ops/assets/{assetId}:
    patch:
      summary: Ubah metadata atau arsipkan aset
      parameters: [ { name: assetId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { '200': { description: OK } }
  /assets/{assetId}/file:
    get:
      summary: Unduh berkas aset aktif (semua pengguna terautentikasi)
      parameters: [ { name: assetId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { '200': { description: Berkas }, '404': { $ref: '#/components/responses/Error' } }
  /auth/students/login:
    post:
      summary: Login murid dengan kode QR + PIN gambar. 5 kegagalan mengunci 15 menit (423).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginCode, pin]
              properties:
                loginCode: { type: string }
                pin: { type: array, minItems: 3, maxItems: 3, description: 'Indeks gambar 0..8; urutan gambar baku: anjing, kucing, ikan, pohon, mobil, apel, bintang, bulan, balon', items: { type: integer, minimum: 0, maximum: 8 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokens' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error' }
  /me/profile:
    get: { summary: Profil murid beserta misi yang ditugaskan (token murid), responses: { '200': { description: OK } } }
  /children:
    get:
      summary: Daftar profil anak milik orang tua
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Child' } } } } }
    post:
      summary: Buat profil anak (data minimum)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChildCreate' } } }
      responses:
        '201': { description: Dibuat, content: { application/json: { schema: { $ref: '#/components/schemas/Child' } } } }
  /children/{childId}:
    delete:
      summary: Hapus profil anak beserta datanya (hak hapus)
      parameters: [ { $ref: '#/components/parameters/ChildId' } ]
      responses:
        '204': { description: Dihapus }
  /children/{childId}/export:
    get:
      summary: Ekspor seluruh data anak (hak akses data)
      parameters: [ { $ref: '#/components/parameters/ChildId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
  /content/packs/latest:
    get:
      summary: Content pack terbitan terbaru yang sesuai usia
      parameters:
        - { name: age, in: query, required: true, schema: { type: integer, minimum: 3, maximum: 8 } }
        - { name: haveVersion, in: query, required: false, schema: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ContentPack' } } } }
        '304': { description: Sudah terbaru }
  /children/{childId}/progress:
    get:
      summary: Ringkasan progres anak untuk dashboard orang tua
      parameters: [ { $ref: '#/components/parameters/ChildId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [levelsCompletedLast7Days, activities, areas]
                properties:
                  areas:
                    type: array
                    description: Lima area dari Dokumen Analisis; hasContent=false bila belum ada aktivitas untuk area tsb
                    items:
                      type: object
                      properties:
                        area: { type: string, enum: [kognitif, motorik_halus, literasi_bahasa, sosio_emosional, karakter] }
                        hasContent: { type: boolean }
                        levelsCompleted: { type: integer }
                  levelsCompletedLast7Days: { type: integer }
                  activities:
                    type: array
                    items:
                      type: object
                      properties:
                        activityId: { type: string }
                        completed: { type: integer }
                        attempts: { type: integer }
                        hints: { type: integer }
                        highestLevel: { type: integer }
                        lastPlayed: { type: string, format: date-time }
  /children/{childId}/policy:
    get:
      summary: Aturan screen time (server authority)
      parameters: [ { $ref: '#/components/parameters/ChildId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ScreenTimePolicy' } } } }
    put:
      summary: Ubah aturan screen time (hanya orang tua)
      parameters: [ { $ref: '#/components/parameters/ChildId' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ScreenTimePolicy' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ScreenTimePolicy' } } } }
  /sync/events:
    post:
      summary: Kirim batch event gameplay (idempoten per event id)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EventBatch' } } }
      responses:
        '200': { description: Hasil, content: { application/json: { schema: { $ref: '#/components/schemas/EventBatchResult' } } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    ClassId: { name: classId, in: path, required: true, schema: { type: string, format: uuid } }
    ChildId: { name: childId, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Error:
      description: Kesalahan
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Health: { type: object, required: [status], properties: { status: { type: string, enum: [ok] } } }
    Error: { type: object, required: [code, message], properties: { code: { type: string }, message: { type: string } } }
    ParentRegistration:
      type: object
      required: [email, password, consentPolicyVersion, consentGranted]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 10 }
        consentPolicyVersion: { type: string }
        consentGranted: { type: boolean, description: Harus true }
    Login: { type: object, required: [email, password], properties: { email: { type: string, format: email }, password: { type: string } } }
    AuthTokens: { type: object, required: [accessToken, refreshToken], properties: { accessToken: { type: string }, refreshToken: { type: string } } }
    ChildCreate:
      type: object
      required: [alias, birthYear]
      properties:
        alias: { type: string, maxLength: 30, description: Nama panggilan/samaran; bukan nama lengkap }
        birthYear: { type: integer }
        avatarId: { type: string }
    Child:
      allOf:
        - $ref: '#/components/schemas/ChildCreate'
        - type: object
          required: [id, pseudonym]
          properties: { id: { type: string, format: uuid }, pseudonym: { type: string, format: uuid } }
    ContentPack:
      type: object
      required: [version, manifest]
      properties: { version: { type: integer }, manifest: { type: object } }
    ScreenTimePolicy:
      type: object
      required: [dailyMinutes, sessionMinutes, version]
      properties:
        dailyMinutes: { type: integer, minimum: 5, maximum: 240 }
        sessionMinutes: { type: integer, minimum: 3, maximum: 60 }
        allowedFrom: { type: string, example: '07:00' }
        allowedTo: { type: string, example: '19:00' }
        version: { type: integer, description: Dinaikkan server; server menang bila konflik }
    GameplayEvent:
      type: object
      required: [id, childId, activityId, contentVersion, type, deviceTs]
      properties:
        id: { type: string, format: uuid, description: Dibuat klien; kunci idempotensi }
        childId: { type: string, format: uuid }
        activityId: { type: string }
        contentVersion: { type: integer }
        type: { type: string, enum: [started, attempt, hint_shown, completed, abandoned] }
        payload: { type: object }
        deviceTs: { type: string, format: date-time }
    EventBatch:
      type: object
      required: [events]
      properties: { events: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/GameplayEvent' } } }
    EventBatchResult:
      type: object
      required: [accepted, duplicates]
      properties:
        accepted: { type: integer }
        duplicates: { type: integer }
        policy: { $ref: '#/components/schemas/ScreenTimePolicy' }
